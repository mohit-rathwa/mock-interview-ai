services:
  - type: web
    name: mock-interview-ai-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        sync: false # JWT Secret for authentication
      - key: GOOGLE_GENAI_API_KEY
        sync: false # Google Gemini API Key
      - key: ALLOWED_ORIGINS
        sync: false # Comma-separated allowed frontend URLs
